<article class="product-card">
  <a href="{{ url_for('product_detail', slug=p.slug) }}" class="product-image">
    {% if p.image %}<img src="{{ url_for('static', filename='uploads/images/' + p.image) }}" alt="{{ p.name }}">{% else %}<span>⚡</span>{% endif %}
  </a>
  <div class="product-body">
    <small>{{ p.category.name if p.category else 'Thiết bị điện' }}</small>
    <h3><a href="{{ url_for('product_detail', slug=p.slug) }}">{{ p.name }}</a></h3>
    <p class="price">{{ "{:,.0f}".format(p.price) }} đ</p>
    <form method="post" action="{{ url_for('cart_add', product_id=p.id) }}"><button class="btn primary full">+ Thêm vào giỏ</button></form>
  </div>
</article>
