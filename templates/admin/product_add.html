{% extends "admin/base.html" %}{% block title %}Thêm sản phẩm{% endblock %}{% block admin_content %}<h1>Thêm sản phẩm</h1><form method="post" enctype="multipart/form-data" class="form-card"><label>Tên sản phẩm<input required name="name"></label><label>Slug<input required name="slug" placeholder="mcb-schneider-1p"></label><label>SKU<input name="sku"></label><label>Danh mục<select name="category_id" required>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>Giá (VNĐ)<input type="number" step="1000" name="price" value="0"></label><label>Tồn kho<input type="number" name="stock" value="0"></label><label>Mô tả<textarea name="description"></textarea></label><label>Thông số kỹ thuật<textarea name="specifications" placeholder="Điện áp: ...&#10;Dòng định mức: ...&#10;Tiêu chuẩn: ..."></textarea></label><label>Ảnh sản phẩm<input type="file" name="image" accept="image/*"></label><label>File CAD / tài liệu<input type="file" name="cad_file"></label><button class="btn primary">Lưu sản phẩm</button></form>{% endblock %}
