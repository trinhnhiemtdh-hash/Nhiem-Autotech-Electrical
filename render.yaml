services:
  - type: web
    name: nhiem-autotech-electrical
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 180 --keep-alive 5 wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SITE_URL
        value: https://nhiemautotech.io.vn
