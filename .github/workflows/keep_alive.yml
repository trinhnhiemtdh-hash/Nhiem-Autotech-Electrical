name: Keep Render Web Service Awake

on:
  schedule:
    # Runs every 10 minutes to keep Render web service awake 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Website
        run: |
          curl -s https://autotech-electrical.onrender.com/ping || true
